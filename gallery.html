  <style>
    /* Gallery-specific styling */
    #gallery h2 {
      text-align: center;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    #gallery p {
      text-align: center;
      margin: 0 auto 2rem;
      max-width: 800px;
      color: #ddd;
    }
    /* Unique gallery container to avoid override */
    .gallery-container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .gallery-card {
      position: relative;
      overflow: hidden;
      border-radius: 0.5rem;
    }
    .gallery-card img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease;
    }
    .gallery-card:hover img {
      transform: scale(1.05);
    }
  </style>
</head>
